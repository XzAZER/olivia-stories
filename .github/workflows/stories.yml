name: Historias Olivia

on:
  schedule:
    # GitHub Actions retrasa los crons compartidos (medido: 2-4 horas los dias malos),
    # y con un solo disparo por slot la ventana de +/-45 min de publish.py se pierde
    # entera (paso del 27 al 30/08: corridas "success" sin publicar nada).
    # Solucion: rafaga de disparos alrededor de cada ventana, en minutos "raros"
    # (los minutos 0 y 30 son los mas congestionados). publish.py ya se banca esto:
    # fuera de ventana no hace nada, y state.json evita duplicados.
    # Slot 11:00 ART = 14:00 UTC (ventana 13:15-14:45 UTC):
    - cron: "7,22,37,52 13 * * *"
    - cron: "7,22,37 14 * * *"
    # Slot 19:30 ART = 22:30 UTC (ventana 21:45-23:15 UTC):
    - cron: "52 21 * * *"
    - cron: "7,22,37,52 22 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot puntual, ej 2026-08-16T11:00 (vacio = el que toque ahora)"
        required: false
      dry_run:
        description: "true para no llamar a la API"
        required: false
        default: "false"
      check:
        description: "true para solo verificar el token, sin publicar nada"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publicar historia
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          RAW_BASE: ${{ vars.RAW_BASE }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.check }}" = "true" ]; then
            ARGS="--check"
          else
            if [ -n "${{ github.event.inputs.slot }}" ]; then
              ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          fi
          python publish.py $ARGS

      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "olivia-bot"
            git config user.email "olivia-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Historia publicada [skip ci]"
            git push
          fi
